<style>
:root{
  --bg:#f3f1ec; --panel:#ffffff; --panel2:#f7f5f0; --line:#ded9cf;
  --ink:#1d220b; --ink2:#4b5238; --ink3:#7b8768;
  --forest:#344414; --olive:#37441D; --accent:#717D4A; --tan:#C99C73; --cream:#FBFAF8;
  --b2000:#1f2f50; --b1000:#2f5d34; --b200:#6fa539; --b0:#c9d13a;
  --boundary:#ffcc33;
}
:root:not([data-theme="light"]){ @media (prefers-color-scheme: dark){
  --bg:#0f120c; --panel:#171c12; --panel2:#1f2618; --line:#333d28;
  --ink:#eef1e6; --ink2:#a8b394; --ink3:#7b8768; --cream:#171c12; --tan:#d4ad88;
}}
:root[data-theme="dark"]{
  --bg:#0f120c; --panel:#171c12; --panel2:#1f2618; --line:#333d28;
  --ink:#eef1e6; --ink2:#a8b394; --ink3:#7b8768; --cream:#171c12; --tan:#d4ad88;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:16px;padding:10px 16px;background:var(--forest);color:#fff;flex:none;min-height:60px}
header img{height:40px;width:auto}
header h1{font:600 18px/1.2 "Cormorant Garamond",Georgia,serif;margin:0;letter-spacing:.02em}
header h1 small{display:block;font:500 11px/1.3 Inter,system-ui,sans-serif;opacity:.8;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
header .stats{margin-left:auto;display:flex;gap:18px;font-size:12px;opacity:.95}
header .stats b{display:block;font-size:18px;font-weight:600;line-height:1.1}
main{flex:1;display:flex;min-height:0;position:relative}
#map{flex:1;min-width:0;background:#cfd8dc}
aside{width:340px;flex:none;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
aside .tools{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;background:var(--panel2)}
aside input[type=search]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;background:var(--panel);color:var(--ink2);display:flex;align-items:center;gap:6px;user-select:none}
.chip.on{background:var(--forest);color:#fff;border-color:var(--forest)}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
#list{flex:1;overflow:auto;padding:4px 0}
.row{display:flex;align-items:center;gap:10px;padding:7px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.row:hover,.row.sel{background:var(--panel2)}
.row .pin{width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff}
.row .n{flex:1;min-width:0}
.row .n b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .n span{font-size:11.5px;color:var(--ink3)}
.row .ha{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:12.5px;white-space:nowrap}
#detail{display:none;flex-direction:column;min-height:0;flex:1}
#detail .head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
#detail .head h2{font:600 20px/1.15 "Cormorant Garamond",Georgia,serif;margin:0}
#detail .head .sub{font-size:12px;color:var(--ink3);margin-top:3px}
#detail .back{background:none;border:1px solid var(--line);border-radius:6px;color:var(--ink2);cursor:pointer;padding:4px 8px;font:inherit;font-size:12px}
#detail .body{padding:10px 14px;overflow:auto;flex:1}
dl{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin:0 0 12px;font-size:13px}
dt{color:var(--ink3)}
dd{margin:0;font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--ink3);background:var(--panel2);border-radius:6px;padding:8px 10px;margin:8px 0}
.desc{font-size:13px;color:var(--ink2);margin:0 0 10px}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:6px 10px;font:inherit;font-size:12.5px;cursor:pointer}
.btn.primary{background:var(--forest);color:#fff;border-color:var(--forest)}
.leaflet-container{font:inherit}
.leaflet-popup-content-wrapper{border-radius:8px}
.leaflet-popup-content{margin:10px 14px;font-size:13px}
.leaflet-popup-content b{font-size:14px}
.pin-icon{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
.pin-icon span{transform:rotate(45deg);color:#fff;font:700 10px/1 Inter,system-ui,sans-serif}
.pin-icon.approx{border-style:dashed}
.legend{background:var(--panel);color:var(--ink);padding:8px 10px;border-radius:8px;box-shadow:0 1px 5px rgba(0,0,0,.3);font-size:12px;line-height:1.7}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.legend .dash{border:1.5px dashed var(--ink3);background:none}
.leaflet-control-layers{font-size:12px}
.leaflet-bar a{color:#222}
#toggle{display:none;position:absolute;right:10px;top:10px;z-index:900;background:var(--forest);color:#fff;border:0;border-radius:6px;padding:8px 12px;font:inherit}
.source{font-size:11px;color:var(--ink3);padding:8px 12px;border-top:1px solid var(--line)}
@media (max-width:760px){
  header .stats{display:none}
  header{padding:8px 16px}
  aside{position:absolute;right:0;top:0;bottom:0;width:min(340px,86vw);transform:translateX(100%);transition:transform .2s;z-index:950;box-shadow:-2px 0 10px rgba(0,0,0,.3)}
  aside.open{transform:none}
  #toggle{display:block}
}
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="Searle Forestry">
  <h1>Track record<small>Forests sold across New Zealand</small></h1>
  <div class="stats"><div><b id="st-n">–</b>forests sold</div><div><b id="st-ha">–</b>hectares</div><div><b id="st-ni">–</b>North Island</div><div><b id="st-si">–</b>South Island</div></div>
</header>
<main>
  <div id="map"></div>
  <button id="toggle">List</button>
  <aside id="aside">
    <div class="tools">
      <input id="q" type="search" placeholder="Search forest, locality or region…" autocomplete="off">
      <div class="chips" id="bands"></div>
      <div class="chips" id="islands"></div>
    </div>
    <div id="list"></div>
    <div id="detail">
      <div class="head"><div style="flex:1"><h2 id="d-name"></h2><div class="sub" id="d-sub"></div></div><button class="back" id="d-back">← All</button></div>
      <div class="body">
        <p class="desc" id="d-desc"></p>
        <dl id="d-dl"></dl>
        <div class="note" id="d-note"></div>
        <div class="btns"><button class="btn primary" id="d-zoom">Zoom to boundary</button><button class="btn" id="d-nz">Whole of NZ</button></div>
      </div>
    </div>
    <div class="source">Boundaries: LINZ Data Service (CC BY 4.0). Imagery: Esri, Maxar, Earthstar Geographics. Areas are as recorded at sale.</div>
  </aside>
</main>

  {key:"0-199", label:"Under 200 ha", color:"#c9c92a", min:0},
];
function bandOf(s){ const a=+s.area_ha||0; return BANDS.find(b=>a>=b.min)||BANDS[3]; }
const fmt=n=>n==null?"–":Number(n).toLocaleString("en-NZ",{maximumFractionDigits:n<100?1:0});

// ---- map
const map=L.map("map",{preferCanvas:false,zoomControl:true,minZoom:4}).setView([-40.9,172.5],5);
const esriImg=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Esri, Maxar, Earthstar Geographics"});
const esriTopo=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Esri"});
const light=L.layerGroup([
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}",{maxZoom:16,attribution:"Esri, HERE, Garmin, © OpenStreetMap contributors"}),
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}",{maxZoom:16,pane:"labels"})]);
const darkBase=L.layerGroup([
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}",{maxZoom:16,attribution:"Esri, HERE, Garmin, © OpenStreetMap contributors"}),
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}",{maxZoom:16,pane:"labels"})]);
const labels=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,pane:"labels"});
map.createPane("labels"); map.getPane("labels").style.zIndex=450; map.getPane("labels").style.pointerEvents="none";
map.createPane("boundary"); map.getPane("boundary").style.zIndex=440;
const dark=matchMedia("(prefers-color-scheme: dark)").matches;
(dark?darkBase:light).addTo(map);
L.control.layers({"Light map":light,"Dark map":darkBase,"Aerial imagery":esriImg,"Topographic":esriTopo},{"Place labels":labels},{position:"topleft",collapsed:true}).addTo(map);
map.on("baselayerchange",e=>{ if(e.layer===esriImg) labels.addTo(map); else map.removeLayer(labels); userBase=e.layer; });
let userBase=null, autoImg=false;
// Boundaries read best over imagery; switch automatically when a forest is opened and
// back again for the whole-of-NZ view, unless the viewer picked a base map themselves.
function useImagery(on){
  const cur=[light,darkBase,esriImg,esriTopo].find(l=>map.hasLayer(l));
  if(on){ if(cur===esriImg||cur===esriTopo) return; if(userBase&&userBase!==light&&userBase!==darkBase) return;
    map.removeLayer(cur); esriImg.addTo(map); labels.addTo(map); autoImg=true; }
  else if(autoImg){ map.removeLayer(esriImg); map.removeLayer(labels); (dark?darkBase:light).addTo(map); autoImg=false; }
}

const legend=L.control({position:"bottomleft"});
legend.onAdd=()=>{const d=L.DomUtil.create("div","legend");d.innerHTML=BANDS.map(b=>`<div><i style="background:${b.color}"></i>${b.label}</div>`).join("")+`<div><i class="dash"></i>Approximate location</div>`;return d;};
legend.addTo(map);

// ---- state
const state={band:new Set(BANDS.map(b=>b.key)),island:new Set(["North","South"]),q:"",sel:null};
const markers=new Map(); let boundaryLayer=null; const parcelCache={};
const group=L.featureGroup().addTo(map);

function icon(s){const b=bandOf(s);const approx=!s.has_boundary;return L.divIcon({className:"",html:`<div class="pin-icon ${approx?"approx":""}" style="background:${b.color}"><span>${s.legend_no||""}</span></div>`,iconSize:[26,26],iconAnchor:[13,26],popupAnchor:[0,-24]});}

SITES.forEach(s=>{
  if(s.lat==null) return;
  const m=L.marker([s.lat,s.lon],{icon:icon(s),title:s.name});
  m.bindPopup(()=>`<b>${s.name}</b><br>${fmt(s.area_ha)} ha${s.locality?" · "+s.locality:""}${s.region?", "+s.region:""}<br><a href="#" onclick="select('${s.id}');return false;">Details & boundary →</a>`);
  m.on("click",()=>select(s.id,false));
  markers.set(s.id,m);
});

function visible(s){
  if(!state.band.has(bandOf(s).key)) return false;
  if(!state.island.has(s.island)) return false;
  if(state.q){const q=state.q.toLowerCase(); if(!(s.name+" "+(s.locality||"")+" "+(s.region||"")+" "+(s.address||"")).toLowerCase().includes(q)) return false;}
  return true;
}
function refresh(){
  group.clearLayers();
  const list=document.getElementById("list"); list.innerHTML="";
  const rows=SITES.filter(visible).sort((a,b)=>(b.area_ha||0)-(a.area_ha||0));
  rows.forEach(s=>{
    const m=markers.get(s.id); if(m) group.addLayer(m);
    const b=bandOf(s);
    const r=document.createElement("div"); r.className="row"+(state.sel===s.id?" sel":""); r.dataset.id=s.id;
    r.innerHTML=`<div class="pin" style="background:${b.color};${s.lat==null?"opacity:.35":""}">${s.legend_no||""}</div><div class="n"><b>${s.name}</b><span>${[s.locality,s.region].filter(Boolean).join(", ")||s.island+" Island"}${s.lat==null?" · not yet mapped":""}</span></div><div class="ha">${fmt(s.area_ha)} ha</div>`;
    r.onclick=()=>select(s.id,true);
    list.appendChild(r);
  });
  document.getElementById("st-n").textContent=SITES.length;
  document.getElementById("st-ha").textContent=fmt(SITES.reduce((a,s)=>a+(+s.area_ha||0),0));
  document.getElementById("st-ni").textContent=SITES.filter(s=>s.island==="North").length;
  document.getElementById("st-si").textContent=SITES.filter(s=>s.island==="South").length;
}
function chips(el,items,set){
  el.innerHTML="";
  items.forEach(it=>{const c=document.createElement("div");c.className="chip"+(set.has(it.key)?" on":"");c.innerHTML=(it.color?`<i style="background:${it.color}"></i>`:"")+it.label;
    c.onclick=()=>{ if(set.has(it.key)&&set.size>1) set.delete(it.key); else set.add(it.key); chips(el,items,set); refresh(); };
    el.appendChild(c);});
}
chips(document.getElementById("bands"),BANDS,state.band);
chips(document.getElementById("islands"),[{key:"North",label:"North Island"},{key:"South",label:"South Island"}],state.island);
document.getElementById("q").addEventListener("input",e=>{state.q=e.target.value.trim();refresh();});
document.getElementById("toggle").onclick=()=>document.getElementById("aside").classList.toggle("open");

async function loadParcel(id){
  if(parcelCache[id]) return parcelCache[id];
  if(PARCELS[id]) return parcelCache[id]=PARCELS[id];
  if(!PARCEL_BASE) return null;
  try{const r=await fetch(PARCEL_BASE+id+".geojson");if(!r.ok)return null;return parcelCache[id]=await r.json();}catch(e){return null;}
}

// fitBounds that survives a container that had no size yet (page still laying out, hidden tab):
// re-checks shortly after and on the next resize, and refits without animation if the zoom is off.
function fitSafe(bounds){
  map.invalidateSize(false);
  map.fitBounds(bounds,{animate:!document.hidden});
  const check=()=>{ map.invalidateSize(false); const want=map.getBoundsZoom(bounds); if(Math.abs(map.getZoom()-want)>1) map.fitBounds(bounds,{animate:false}); };
  setTimeout(check,400); map.once("resize",check);
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) check(); },{once:true});
}
async function select(id,zoom=true){
  const s=SITES.find(x=>x.id===id); if(!s) return;
  state.sel=id; refresh();
  document.getElementById("list").style.display="none";
  const d=document.getElementById("detail"); d.style.display="flex";
  document.getElementById("d-name").textContent=s.name;
  document.getElementById("d-sub").textContent=[s.address||s.locality,s.region].filter(Boolean).join(", ")||(s.island+" Island");
  document.getElementById("d-desc").textContent=s.description||"";
  const dl=[["Area sold",fmt(s.area_ha)+" ha"]];
  if(s.parcel_area_ha) dl.push(["LINZ title area",fmt(s.parcel_area_ha)+" ha"]);
  if(s.sale_year) dl.push(["Sold",s.sale_date||String(s.sale_year)]);
  if(s.tenure) dl.push(["Tenure",s.tenure]);
  if(s.vendor_type) dl.push(["Vendor",s.vendor_type]);
  if(s.titles&&s.titles.length) dl.push(["Titles",s.titles.slice(0,8).join(", ")+(s.titles.length>8?" +"+(s.titles.length-8):"")]);
  dl.push(["Island",s.island]);
  document.getElementById("d-dl").innerHTML=dl.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("");
  const note=document.getElementById("d-note");
  if(s.lat==null){note.style.display="block";note.textContent="Location not yet confirmed — this sale is listed but not pinned.";}
  else if(!s.has_boundary){note.style.display="block";note.textContent="Approximate location (placed by locality). LINZ boundary not yet linked.";}
  else if(s.notes){note.style.display="block";note.textContent=s.notes;}
  else note.style.display="none";
  if(boundaryLayer){map.removeLayer(boundaryLayer);boundaryLayer=null;}
  document.getElementById("d-zoom").textContent=s.has_boundary?"Zoom to boundary":"Zoom in";
  if(s.lat!=null){
    const m=markers.get(id);
    if(s.has_boundary){
      const gj=await loadParcel(id);
      if(gj){boundaryLayer=L.geoJSON(gj,{pane:"boundary",style:{color:"#ffcc33",weight:2.5,fillColor:"#ffcc33",fillOpacity:.12}}).addTo(map);
        if(zoom){ fitSafe(boundaryLayer.getBounds().pad(0.25)); useImagery(true); }}
      else if(zoom) map.setView([s.lat,s.lon],13,{animate:!document.hidden});
    } else if(zoom) map.setView([s.lat,s.lon],11,{animate:!document.hidden});
    if(m&&zoom) m.openPopup();
  }
  if(innerWidth<=760&&zoom) document.getElementById("aside").classList.remove("open");
}
document.getElementById("d-back").onclick=()=>{state.sel=null;document.getElementById("detail").style.display="none";document.getElementById("list").style.display="block";if(boundaryLayer){map.removeLayer(boundaryLayer);boundaryLayer=null;}refresh();};
document.getElementById("d-zoom").onclick=()=>{if(boundaryLayer)fitSafe(boundaryLayer.getBounds().pad(0.25));else if(state.sel){const s=SITES.find(x=>x.id===state.sel);if(s&&s.lat!=null)map.setView([s.lat,s.lon],12);}};
document.getElementById("d-nz").onclick=()=>{ useImagery(false); map.fitBounds(group.getBounds().pad(0.05)); };
refresh();
// Initial whole-of-NZ fit. A timeout rather than requestAnimationFrame: rAF does not fire
// while the tab is hidden, and would then override a selection made in the meantime.
// No animation on load: a zoom animation that never finishes (hidden tab) swallows every later setView.
map.invalidateSize();
if(location.hash.length>1){ select(decodeURIComponent(location.hash.slice(1)),true); }
else if(group.getLayers().length) map.fitBounds(group.getBounds().pad(0.05),{animate:false});
</script>
</body>
</html>
